[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "queennet-hsi"
version = "1.0.0"
description = "Reproduction of QueenNet: Quantum-Enhanced Neural Network for Hyperspectral Image Classification (IEEE JSTARS 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Antigravity AI Research", email = "research@deepmind.google"}
]
dependencies = [
    "pennylane>=0.40.0",
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "h5py>=3.10.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "seaborn>=0.13.0",
    "pytest>=8.0.0",
    "jupyter>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]