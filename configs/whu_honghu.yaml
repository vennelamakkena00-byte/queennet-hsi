# WHU-Hi-HongHu Reproduction Configuration (Paper Benchmark)
seed: 42

dataset:
  name: "whu_hi_honghu"
  image_path: "data/raw/whu_hi_honghu/WHU_Hi_HongHu.mat"
  gt_path: "data/raw/whu_hi_honghu/WHU_Hi_HongHu_gt.mat"
  in_bands: 270
  num_classes: 22
  patch_size: 32
  train_samples_per_class: 20
  val_samples_per_class: 10
  test_samples_per_class: 30
  selected_classes: null

model:
  in_bands: 270
  num_classes: 22
  num_qubits: 12
  depth_L: 2
  patch_size: 32
  device_name: "default.qubit"
  diff_method: "backprop"

training:
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 8
  max_epochs: 100
  patience: 20
  loss: "cross_entropy"

output:
  dir: "outputs/whu_honghu"
