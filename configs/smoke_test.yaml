# Fast Smoke Test Configuration for QueenNet
seed: 42

dataset:
  name: "synthetic"
  in_bands: 103
  num_classes: 2
  patch_size: 32
  height: 64
  width: 64
  train_samples_per_class: 20
  val_samples_per_class: 10
  test_samples_per_class: 20
  selected_classes: [1, 2]

model:
  in_bands: 103
  num_classes: 2
  num_qubits: 12
  depth_L: 2
  patch_size: 32
  device_name: "default.qubit"
  diff_method: "backprop"

training:
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 4
  max_epochs: 2
  patience: 5
  loss: "cross_entropy"

output:
  dir: "outputs/smoke_test"
