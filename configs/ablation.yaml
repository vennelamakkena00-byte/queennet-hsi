# Quantum Convolution Depth Ablation Configuration (L = 1..5)
seed: 42

dataset:
  name: "synthetic"
  in_bands: 103
  num_classes: 4
  patch_size: 32
  height: 64
  width: 64
  train_samples_per_class: 15
  val_samples_per_class: 5
  test_samples_per_class: 15
  selected_classes: [1, 2, 3, 4]

model:
  in_bands: 103
  num_classes: 4
  num_qubits: 12
  depth_L_values: [1, 2, 3, 4, 5]
  patch_size: 32
  device_name: "default.qubit"
  diff_method: "backprop"

training:
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 4
  max_epochs: 10
  patience: 5
  loss: "cross_entropy"

output:
  dir: "outputs/ablation"
